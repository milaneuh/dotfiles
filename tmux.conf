# Panes must use zsh regardless of the OS login shell (which install.sh also
# chsh's to zsh, but that only applies to *new* sessions) — otherwise every
# split/new-window opens plain bash with none of zshrc's prompt/aliases.
set -g default-shell /bin/zsh

bind -N "Reload configuration" q source-file ~/.tmux.conf \; display "Configuration reloaded"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Gruvbox Material (medium dark) — same palette as Alacritty and Helix
set -g status-style "bg=#282828,fg=#d4be98"
set -g status-left "#[bg=#d8a657,fg=#282828,bold] #S #[bg=#282828,fg=#d8a657]"
set -g status-right "#[fg=#3c3836,bg=#282828]#[bg=#3c3836,fg=#d4be98] %H:%M #[fg=#7daea3,bg=#3c3836]#[bg=#7daea3,fg=#282828,bold] #h "
setw -g window-status-current-style "bg=#3c3836,fg=#d8a657,bold"
setw -g window-status-current-format " #I:#W "
setw -g window-status-style "fg=#d4be98"
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#a9b665"
set -g message-style "bg=#d8a657,fg=#282828,bold"
set -g message-command-style "bg=#3c3836,fg=#d4be98"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin '27medkamal/tmux-session-wizard'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
