# Basic options --------------------------------------------------------------

cursor_blink_interval 0
enable_audio_bell no

# Replace clipboard at each copy (solved trouble with tmux);
clipboard_control write-primary write-clipboard no-append

hide_window_decorations true

background_opacity 0.98

# Remove remap ---------------------------------------------------------------

clear_all_shortcuts yes

# These are special and need to be disable unitary
map ctrl+shift+r discard_event
map ctrl+shift+t no_op

# Keep this remap
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+v pass_through

# Add remap ------------------------------------------------------------------

map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0

# Rewrite keysym events as unique escape sequences ---------------------------

# Makes Alt+[ usable as a binding (TMUX)
# By default Alt+[ sends \e[ which is the CSI prefix (Control Sequence Introducer)
# This breaks most TUIs (opencode, lazygit, ...)
# \x1b[777~ is an unused xterm-style CSI ~ sequence
map alt+[ send_text all \x1b[777~

# Makes Ctrl+Enter usable as a binding (TMUX)
# By default this key is not recognized
# Very useful for opencode
# \x1b[13;5u is CSI u: codepoint 13 (CR) + modifier mask 5 (ctrl)
map ctrl+enter send_text all \x1b[13;5u

# Distinguishes Ctrl+Backspace from Ctrl+H (TMUX)
# By default Ctrl+Backspace sends \x08, the same byte as Ctrl+H
# Ctrl+H is already used to move to the left split
# \x1b[127;5u is CSI u: codepoint 127 (DEL) + modifier mask 5 (ctrl)
map ctrl+backspace send_text all \x1b[127;5u

# Distinguishes Ctrl+Shift+Q from Ctrl+Q (TMUX)
# A terminal sends the same byte for both
# Used to quit ranger while changing directory
# \x1b[778~ is an unused xterm-style CSI ~ sequence
map ctrl+shift+q send_text all \x1b[778~

# Appearence -----------------------------------------------------------------

# Nerd font
symbol_map U+e000-U+e00a,U+ea60-U+ebeb,U+e0a0-U+e0c8,U+e0ca,U+e0cc-U+e0d7,U+e200-U+e2a9,U+e300-U+e3e3,U+e5fa-U+e6b7,U+e700-U+e8ef,U+ed00-U+efc1,U+f000-U+f2ff,U+f000-U+f2e0,U+f300-U+f381,U+f400-U+f533,U+f0001-U+f1af0 Symbols Nerd Font Mono

shell_integration no-title
