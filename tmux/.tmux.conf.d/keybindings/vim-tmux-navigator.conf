bind -n 'C-h' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys C-h'  'select-pane -L'
bind -n 'C-j' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys C-j'  'select-pane -D'
bind -n 'C-k' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys C-k'  'select-pane -U'
bind -n 'C-l' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys C-l'  'select-pane -R'
bind -T copy-mode-vi 'C-h' select-pane -L
bind -T copy-mode-vi 'C-j' select-pane -D
bind -T copy-mode-vi 'C-k' select-pane -U
bind -T copy-mode-vi 'C-l' select-pane -R
bind -T copy-mode-vi 'C-\' select-pane -l

bind -n 'M-h' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys M-h'  'select-pane -L'
bind -n 'M-j' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys M-j'  'select-pane -D'
bind -n 'M-k' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys M-k'  'select-pane -U'
bind -n 'M-l' if-shell "~/.tmux.conf.d/scripts/is_vim.sh" 'send-keys M-l'  'select-pane -R'
bind -T copy-mode-vi 'M-h' select-pane -L
bind -T copy-mode-vi 'M-j' select-pane -D
bind -T copy-mode-vi 'M-k' select-pane -U
bind -T copy-mode-vi 'M-l' select-pane -R
bind -T copy-mode-vi 'M-\' select-pane -l
