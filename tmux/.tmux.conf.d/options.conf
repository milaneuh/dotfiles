unbind C-b

set-option -g mouse on

set-option -g base-index 1
set-option -w -g pane-base-index 1

set-option -w -g mode-keys vi

set-option -g history-limit 20000

set-option -g status-right ''
set-option -g status-left-length 40

# Renumber windows at each change
set-option -g renumber-windows on

# Focus event support
set-option -g focus-events on

# No delay typping a key, avoid trouble while using vim
set-option -s -g escape-time 0

# Allow external program such as vim to display picture
set-option -g -q allow-passthrough on
set-option -g visual-activity off

# Alt+[ re-encodé en \e[777~ par kitty, déclaré comme user-key pour tmux
set -s user-keys[0] "\e[777~"
