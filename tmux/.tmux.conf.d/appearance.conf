set -g status-style fg=default

if-shell -b "gsettings get org.gnome.desktop.interface color-scheme | grep default" {
  set -g window-status-current-style 'fg=#000000,bold'
  set -g status-fg "#000000"
}

if-shell -b "gsettings get org.gnome.desktop.interface color-scheme | grep dark" {
  set -g window-status-current-style 'fg=yellow,bold'
  set -g status-fg white
}